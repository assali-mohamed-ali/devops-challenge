name: intern-task-terraform ci

on:
  pull_request:
    paths:
      - "intern-task-terraform/**"
      - ".github/workflows/intern-task-terraform-ci.yml"
  push:
    branches: [main]
    paths:
      - "intern-task-terraform/**"
      - ".github/workflows/intern-task-terraform-ci.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intern-task-terraform/terraform
    env:
      # Fake credentials are safe here because this workflow only plans and
      # the AWS provider skips credential/account/region validation.
      AWS_ACCESS_KEY_ID: fake
      AWS_SECRET_ACCESS_KEY: fake
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.0"

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Initialize
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -lock=false -var="ssh_cidr=203.0.113.10/32"
